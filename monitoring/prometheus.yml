global:
  scrape_interval: 10s
scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8080"] }]
  - job_name: product
    static_configs: [{ targets: ["product:8081"] }]
  - job_name: inventory
    static_configs: [{ targets: ["inventory:8082"] }]
  - job_name: order
    static_configs: [{ targets: ["order:8083"] }]
