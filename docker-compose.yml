services:
  gateway:
    build: ./gateway
    ports: ["8080:8080"]
    depends_on: [product, order, inventory]
  product:
    build: ./product
    ports: ["8081:8081"]
  inventory:
    build: ./inventory
    ports: ["8082:8082"]
  order:
    build: ./order
    environment: { INVENTORY_URL: "http://inventory:8082" }
    depends_on: [inventory]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    depends_on: [prometheus]
  frontend:
    build: ./frontend
    ports: ["8090:8090"]
    environment: { GATEWAY_URL: "http://gateway:8080" }
    depends_on: [gateway]
