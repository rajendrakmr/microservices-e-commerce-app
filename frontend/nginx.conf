server {
  listen 8090;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
  location / {
    try_files $uri /index.html;
  }
}
